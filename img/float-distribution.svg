<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 245" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif">
  <rect width="900" height="245" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f1f1f">浮点数在数轴上的分布（越接近 0 越稠密）</text>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>

  <line x1="60" y1="160" x2="840" y2="160" stroke="#333" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>

  <text x="72" y="142" text-anchor="middle" font-size="13" fill="#555">−∞</text>
  <text x="828" y="142" text-anchor="middle" font-size="13" fill="#555">+∞</text>

  <line x1="450" y1="148" x2="450" y2="172" stroke="#333" stroke-width="2"/>
  <text x="450" y="190" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f1f1f">0</text>

  <path d="M 60 160 Q 140 158 210 148 Q 290 132 360 104 Q 420 82 450 80 Q 480 82 540 104 Q 610 132 690 148 Q 760 158 840 160 L 840 160 L 60 160 Z" fill="#1a73e8" opacity="0.10"/>
  <path d="M 60 160 Q 140 158 210 148 Q 290 132 360 104 Q 420 82 450 80 Q 480 82 540 104 Q 610 132 690 148 Q 760 158 840 160" fill="none" stroke="#1a73e8" stroke-width="2" opacity="0.55"/>
  <text x="450" y="66" text-anchor="middle" font-size="11" fill="#1a73e8">可表示数的密度曲线</text>

  <g fill="#d93025">
    <circle cx="438" cy="160" r="3.5"/>
    <circle cx="420" cy="160" r="3.5"/>
    <circle cx="395" cy="160" r="3.5"/>
    <circle cx="365" cy="160" r="3.5"/>
    <circle cx="328" cy="160" r="3.5"/>
    <circle cx="285" cy="160" r="3.5"/>
    <circle cx="235" cy="160" r="3.5"/>
    <circle cx="180" cy="160" r="3.5"/>
    <circle cx="120" cy="160" r="3.5"/>
    <circle cx="462" cy="160" r="3.5"/>
    <circle cx="480" cy="160" r="3.5"/>
    <circle cx="505" cy="160" r="3.5"/>
    <circle cx="535" cy="160" r="3.5"/>
    <circle cx="572" cy="160" r="3.5"/>
    <circle cx="615" cy="160" r="3.5"/>
    <circle cx="665" cy="160" r="3.5"/>
    <circle cx="720" cy="160" r="3.5"/>
    <circle cx="780" cy="160" r="3.5"/>
  </g>

  <g stroke="#bbbbbb" stroke-width="1">
    <line x1="438" y1="165" x2="438" y2="171"/>
    <line x1="420" y1="165" x2="420" y2="171"/>
    <line x1="395" y1="165" x2="395" y2="171"/>
    <line x1="365" y1="165" x2="365" y2="171"/>
    <line x1="328" y1="165" x2="328" y2="171"/>
    <line x1="285" y1="165" x2="285" y2="171"/>
    <line x1="235" y1="165" x2="235" y2="171"/>
    <line x1="180" y1="165" x2="180" y2="171"/>
    <line x1="120" y1="165" x2="120" y2="171"/>
    <line x1="462" y1="165" x2="462" y2="171"/>
    <line x1="480" y1="165" x2="480" y2="171"/>
    <line x1="505" y1="165" x2="505" y2="171"/>
    <line x1="535" y1="165" x2="535" y2="171"/>
    <line x1="572" y1="165" x2="572" y2="171"/>
    <line x1="615" y1="165" x2="615" y2="171"/>
    <line x1="665" y1="165" x2="665" y2="171"/>
    <line x1="720" y1="165" x2="720" y2="171"/>
    <line x1="780" y1="165" x2="780" y2="171"/>
  </g>

  <text x="110" y="192" text-anchor="middle" font-size="12" fill="#666">特殊值</text>
  <text x="250" y="192" text-anchor="middle" font-size="12" fill="#666">稀疏</text>
  <text x="375" y="192" text-anchor="middle" font-size="12" fill="#666">稠密</text>
  <text x="525" y="192" text-anchor="middle" font-size="12" fill="#666">稠密</text>
  <text x="650" y="192" text-anchor="middle" font-size="12" fill="#666">稀疏</text>
  <text x="790" y="192" text-anchor="middle" font-size="12" fill="#666">特殊值</text>

  <text x="450" y="225" text-anchor="middle" font-size="12.5" fill="#666">间距越靠近 0 越小（指数增长），超出可表示范围 → ±∞ 或 NaN</text>
</svg>
